# CNN Teacher Model Configuration for Seashell 75-view
# Dedicated teacher model for seashell dataset - trained on 75 views
# Goal: Better than Pine teacher (21.54 PSNR, 0.602 SSIM) and Walnut teacher (17.62 PSNR, 0.582 SSIM)

data_path: ./data/real_dataset/cone_ntrain_75_angle_360/seashell
dataset_type: Blender
epochs: 75
log_interval: 10
lr: 0.001
lr_patience: 15
max_projections: null
model_size: large
num_workers: 0
output_dir: ./cnn_teacher_seashell_75view
proj_size:
  - 64
  - 64
save_interval: 5
seed: 42
ssim_weight: 0.2
use_dropout: true
use_ssim: true
use_tensorboard: false
vol_size:
  - 64
  - 64
  - 64
weight_decay: 1.0e-05
resume_from: null