# CNN Teacher Model Configuration for Walnut 75-view
# Dedicated teacher model for walnut dataset - trained on 75 views
# Can generalize to 25, 50, 75 views through max_projections control

data_path: ./data/real_dataset/cone_ntrain_75_angle_360/walnut
dataset_type: Blender
epochs: 50
log_interval: 10
lr: 0.001
lr_patience: 10
max_projections: null
model_size: medium
num_workers: 0
output_dir: ./cnn_teacher_walnut_75view
proj_size:
  - 64
  - 64
save_interval: 5
seed: 42
ssim_weight: 0.2
use_dropout: true
use_ssim: true
use_tensorboard: false
vol_size:
  - 64
  - 64
  - 64
weight_decay: 1.0e-05
resume_from: null
